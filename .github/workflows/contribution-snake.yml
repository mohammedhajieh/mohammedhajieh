name: Refresh contribution snake
on:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/contribution-snake.svg
      - name: Publish updated animation
        run: |
          test -s assets/contribution-snake.svg
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution snake'
          git pull --rebase origin main
          git push origin HEAD:main
